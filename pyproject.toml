[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-agent"
version = "0.1.0"
description = "Evidence-grounded enterprise QA with a bounded LangGraph tool loop"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.0,<2", "pydantic>=2.7,<3", "httpx>=0.27,<1",
  "numpy>=1.26,<3", "jieba==0.42.1", "rank-bm25==0.2.2", "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]
ingestion = ["pdfplumber>=0.11,<0.12", "pypdfium2>=4.30,<6", "rapidocr-onnxruntime==1.4.4",
             "qdrant-client>=1.15,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
knowledge-agent = "knowledge_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110
